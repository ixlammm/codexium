name: build-app-release

on:
  workflow_dispatch:
  push:
    branches: [full-build]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # The base app payload is fetched at build time (local `app/` if present,
      # otherwise downloaded from the codex-app-payload GitHub release) by
      # tooling/fetch-payload.cjs, which fails loudly if it can't be found.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (root)
        run: |
          npm ci --ignore-scripts

      - name: Install forge-project deps
        run: |
          cd forge-project
          npm ci --ignore-scripts 2>$null || pnpm install --frozen-lockfile || npm install
        shell: pwsh

      - name: Ensure base app payload (local or download from release)
        run: |
          node tooling/fetch-payload.cjs
        shell: pwsh

      # Download the latest codexium-cli release so we use the published binary
      # (instead of building it in CI). Falls back to building from the submodule.
      - name: Download latest codexium-cli release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cli | Out-Null
          $url = "https://github.com/ixlammm/codexium-cli/releases/latest/download/codex.exe"
          try { Invoke-WebRequest -Uri $url -OutFile cli/codex.exe -UseBasicParsing; Write-Host "downloaded cli/codex.exe" }
          catch { Write-Host "codexium-cli has no codex.exe release asset — will build from submodule" }
        continue-on-error: true
        id: cli_dl

      - name: Build codexium-cli (if release download failed / no .exe)
        if: steps.cli_dl.outcome != 'success' || !hashFiles('cli/codex.exe')
        run: |
          $env:LOCAL_CODEX_EXE = "${{ github.workspace }}\codexium-cli\codex-rs\target\debug\codex.exe"
          cargo build --bin codex -p codex-cli --manifest-path codexium-cli/codex-rs/Cargo.toml
        shell: pwsh

      - name: Build patched Codex app
        run: |
          $cli = if (Test-Path "cli/codex.exe") { "cli/codex.exe" } else { "${{ github.workspace }}\codexium-cli\codex-rs\target\debug\codex.exe" }
          $env:LOCAL_CODEX_EXE = Join-Path $PWD $cli
          # Electron is resolved at runtime by the packager; ensure node avail.
          node tooling/build.cjs --rebuild
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-win32-x64
          path: forge-project/out/Codex-win32-x64

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            forge-project/out/Codex-win32-x64/Codex.exe
          generate_release_notes: true
