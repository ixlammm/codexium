name: build-app-release

on:
  workflow_dispatch:
  push:
    branches: [full-build]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: prod
            cliAsset: codex.exe
            outDir: forge-project/out
          - flavor: dev
            cliAsset: codex-dev.exe
            outDir: forge-project/out-dev
    runs-on: windows-latest
    env:
      FLAVOR: ${{ matrix.flavor }}
      # Keep the work copy on the same drive as the repo (swap renames WORK->FORGE,
      # which cannot cross drives on Windows).
      WORK_DIR: D:\a\work\codex-rebuild-work-${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (root)
        run: npm ci --ignore-scripts

      - name: Install forge-project deps (pnpm workspace)
        shell: pwsh
        run: |
          corepack enable
          cd forge-project
          pnpm install --ignore-scripts
        continue-on-error: true

      - name: Ensure base app payload (local or download from release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: node tooling/fetch-payload.cjs

      - name: Download ${{ matrix.cliAsset }} (codexium-cli release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path cli | Out-Null
          $url = "https://github.com/ixlammm/codexium-cli/releases/latest/download/${{ matrix.cliAsset }}"
          try { Invoke-WebRequest -Uri $url -Headers @{ Authorization = "token $env:GH_TOKEN" } -OutFile cli/codex.exe -UseBasicParsing; Write-Host "downloaded ${{ matrix.cliAsset }}" }
          catch { Write-Host "no ${{ matrix.cliAsset }} release asset — will build from submodule" }
        continue-on-error: true
        id: cli_dl

      - name: Build ${{ matrix.flavor }} app
        shell: pwsh
        env:
          OUT_DIR: ${{ github.workspace }}/${{ matrix.outDir }}
          # dev app swaps in the dev cli, prod the prod cli (both staged as cli/codex.exe)
          LOCAL_CODEX_EXE: ${{ github.workspace }}/cli/codex.exe
        run: |
          if (-not (Test-Path cli/codex.exe)) {
            throw "No ${{ matrix.cliAsset }} downloaded and no submodule build path. Publish ${{ matrix.cliAsset }} to ixlammm/codexium-cli releases."
          }
          node tooling/build.cjs --rebuild

      - name: Make MSIX installer (electron-windows-msix, unsigned/sideload)
        if: matrix.flavor == 'prod'
        continue-on-error: true
        shell: pwsh
        env:
          MSIX_APP_DIR: ${{ github.workspace }}/${{ matrix.outDir }}/Codex-win32-x64
          MSIX_OUT_DIR: ${{ github.workspace }}/${{ matrix.outDir }}/installer
        run: |
          node tooling/make-msix.cjs

      - name: Upload ${{ matrix.flavor }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-${{ matrix.flavor }}
          path: ${{ github.workspace }}/${{ matrix.outDir }}

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Codex-*
          path: .artifacts
          merge-multiple: false

      - name: Package app bundles as arch-named zips + collect MSIX
        shell: bash
        run: |
          set -e
          cd .artifacts
          for f in prod dev; do
            d="Codex-$f"
            if [ -d "$d/Codex-win32-x64" ]; then
              # from .artifacts/Codex-<f>/Codex-win32-x64, ../../ is .artifacts
              ( cd "$d/Codex-win32-x64" && zip -qr "../../Codex-$f-x64-app.zip" . )
              echo "made Codex-$f-x64-app.zip"
            fi
          done
          # Collect any MSIX / Squirrel Setup.exe produced by the prod 'make' step
          find . \( -name "*.msix*" -o -name "Setup.exe" -o -name "*Setup-x64.exe" \) | while read -r m; do
            case "$m" in
              *.msix*) t="msix" ;;
              *)       t="exe" ;;
            esac
            cp "$m" "./Codex-prod-x64.$t"
            echo "collected installer: $(basename "$m") -> Codex-prod-x64.$t"
          done
          ls -la ./*.zip ./*.msix ./*.exe 2>/dev/null || true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF##refs/tags/}"
          REPO="$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          cd .artifacts
          gh release upload "$TAG" --repo "$REPO" ./*.zip --clobber
          gh release upload "$TAG" --repo "$REPO" ./*.msix ./*.exe --clobber || true
          echo "uploaded zips + installers to $TAG"
